<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b1a">
<style>
:root{--bg:#0b0b1a;--tx:#fff;--tx2:rgba(255,255,255,.65);--edge:rgba(255,255,255,.38);--shine:rgba(255,255,255,.55);--glass:.18;--blur:28px;--h:250;--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#dfe6ff;--tx:#12122b;--tx2:rgba(18,18,43,.6);--edge:rgba(255,255,255,.8);--shine:rgba(255,255,255,.95);color-scheme:light}}
:root[data-theme="light"]{--bg:#dfe6ff;--tx:#12122b;--tx2:rgba(18,18,43,.6);--edge:rgba(255,255,255,.8);--shine:rgba(255,255,255,.95);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow:hidden;display:grid;place-items:center;user-select:none}
.blobs{position:fixed;inset:0;overflow:hidden;filter:hue-rotate(calc((var(--h) - 250) * 1deg));transition:filter 1s}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9;animation:float 14s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-15vmax;background:#7b4dff}
.blobs i:nth-child(2){width:55vmax;height:55vmax;right:-22vmax;top:25vh;background:#ff4d8d;animation-delay:-5s}
.blobs i:nth-child(3){width:50vmax;height:50vmax;left:5vmax;bottom:-25vmax;background:#2dd4ff;animation-delay:-9s}
.blobs.paused i{animation-play-state:paused}
@keyframes float{to{transform:translate(8vmax,-6vmax) scale(1.15)}}

.glass{position:relative;background:rgba(255,255,255,var(--glass));-webkit-backdrop-filter:blur(var(--blur)) saturate(190%);backdrop-filter:blur(var(--blur)) saturate(190%);border:1px solid var(--edge);box-shadow:inset 0 1.5px 0 var(--shine),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 22px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.35)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 65%,rgba(255,255,255,.14))}

.app{width:min(92vw,400px);max-height:94vh;overflow-y:auto;scrollbar-width:none;border-radius:44px;padding:20px 22px 26px;display:flex;flex-direction:column;gap:18px;transform-origin:50% 100%;box-shadow:inset 0 1.5px 0 var(--shine),inset 0 -1px 0 rgba(255,255,255,.12),inset 0 0 22px rgba(255,255,255,.06),calc(var(--shx,0px)) calc(24px + var(--shy,0px)) calc(56px + var(--shb,0px)) rgba(0,0,0,.42)}
.app::-webkit-scrollbar{display:none}.app>*{flex-shrink:0}
.app.in{animation:popIn .75s var(--spring) both}
.app.out{animation:popOut .5s cubic-bezier(.5,-.4,.7,.2) both;pointer-events:none}
@keyframes popIn{0%{transform:scale(.45) translateY(120px);opacity:0}55%{opacity:1}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes popOut{0%{transform:scale(1)}25%{transform:scale(1.05) translateY(-8px)}100%{transform:scale(.3) translateY(160px);opacity:0}}

.top{display:flex;justify-content:space-between;align-items:center}
.top b{font-size:15px;font-weight:600;letter-spacing:.2px}
.chip{width:42px;height:42px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.14);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:transform .45s var(--spring);box-shadow:inset 0 1px 0 var(--shine)}
.chip:active,.ctl:active{transform:scale(.8)}
.chip svg{width:20px;height:20px}

.art{width:min(100%,40vh);margin:0 auto;aspect-ratio:1;border-radius:34px;display:grid;place-items:center;transform:scale(.84);transition:transform .7s var(--spring),box-shadow .7s;box-shadow:0 10px 24px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.5);background:linear-gradient(145deg,hsl(var(--ah) 90% 62%),hsl(calc(var(--ah) + 60) 85% 48%));--ah:250;overflow:hidden;position:relative}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(255,255,255,.55),transparent 45%)}
.art svg{width:38%;opacity:.9;color:#fff;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.playing .art{transform:scale(1);box-shadow:0 26px 50px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.5)}

.meta h2{margin:0;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:4px 0 0;color:var(--tx2);font-size:15px}
.seek{display:flex;flex-direction:column;gap:6px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.25) var(--p,0%));outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .3s var(--spring)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.35)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff}
.row{display:flex;justify-content:center;align-items:center;gap:26px}
.ctl{border:0;background:none;color:var(--tx);cursor:pointer;display:grid;place-items:center;min-width:48px;min-height:48px;touch-action:manipulation;transition:transform .45s var(--spring)}
.ctl svg{width:34px;height:34px}
.ctl.main{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid var(--edge);box-shadow:inset 0 1.5px 0 var(--shine),0 10px 24px rgba(0,0,0,.3)}
.ctl.main svg{width:38px;height:38px}
.ctl.main.bump{animation:bump .6s var(--spring)}
@keyframes bump{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.pp .pa{display:none}.playing .pp .pl{display:none}.playing .pp .pa{display:block}

.art.swap{animation:artSwap .95s ease-in both}
.meta.swap{animation:metaSwap .95s ease-in both}
@keyframes artSwap{0%{translate:0 0;rotate:0deg;scale:1;opacity:1;filter:blur(0)}38%{translate:calc(var(--d) * -80px) 0;rotate:calc(var(--d) * -9deg);scale:.7;opacity:0;filter:blur(12px)}39%{translate:calc(var(--d) * 80px) 0;rotate:calc(var(--d) * 9deg);scale:.7;opacity:0;filter:blur(12px);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}100%{translate:0 0;rotate:0deg;scale:1;opacity:1;filter:blur(0)}}
@keyframes metaSwap{0%{translate:0 0;opacity:1;filter:blur(0)}38%{translate:calc(var(--d) * -36px) 0;opacity:0;filter:blur(8px)}39%{translate:calc(var(--d) * 36px) 0;opacity:0;filter:blur(8px);animation-timing-function:cubic-bezier(.34,1.56,.64,1)}100%{translate:0 0;opacity:1;filter:blur(0)}}
.lh{font-size:16px;font-weight:700;margin-top:4px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:-8px}
.it{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:20px;cursor:pointer;transition:transform .45s var(--spring),background .3s}
.it:active{transform:scale(.95)}
.it.cur{background:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 var(--shine)}
.th{width:44px;height:44px;border-radius:13px;flex:none;background:linear-gradient(145deg,hsl(var(--ah) 90% 62%),hsl(calc(var(--ah) + 60) 85% 48%));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.tt{min-width:0;flex:1;display:flex;flex-direction:column}
.tt b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{color:var(--tx2);font-size:13px}
.eq{display:none;align-items:flex-end;gap:3px;height:16px}
.playing .cur .eq{display:flex}
.eq i{width:3px;background:var(--tx);border-radius:2px;animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{from{height:4px}to{height:16px}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .4s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(92vw,400px);margin-left:calc(min(92vw,400px) / -2);border-radius:36px;padding:14px 22px 22px;display:none;flex-direction:column;gap:14px;transform-origin:50% 100%}
.sheet.show{display:flex}
.sheet.in{animation:sheetIn .65s var(--spring) both}
.sheet.out{animation:sheetOut .42s cubic-bezier(.5,-.4,.7,.2) both}
@keyframes sheetIn{0%{transform:translateY(110%) scale(.85)}100%{transform:none}}
@keyframes sheetOut{0%{transform:none}25%{transform:translateY(-12px) scale(1.02)}100%{transform:translateY(120%) scale(.85)}}
.grab{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.5);align-self:center}
.sheet h3{margin:0;font-size:18px}
.opt{display:flex;flex-direction:column;gap:8px;font-size:14px}
.opt span{display:flex;justify-content:space-between;color:var(--tx2)}
.btns{display:flex;gap:10px}
.pill{flex:1;padding:13px;border-radius:22px;border:1px solid var(--edge);background:rgba(255,255,255,.18);color:var(--tx);font:600 15px inherit;font-family:inherit;cursor:pointer;transition:transform .45s var(--spring);box-shadow:inset 0 1px 0 var(--shine)}
.pill:active{transform:scale(.9)}

.bubble{position:fixed;bottom:calc(36px + env(safe-area-inset-bottom,0px));left:50%;margin-left:-36px;width:72px;height:72px;border-radius:50%;display:none;place-items:center;cursor:pointer;color:var(--tx);border-radius:50%}
.bubble.show{display:grid;animation:popIn .7s var(--spring) both}
.bubble svg{width:30px;height:30px}
/* Keyboard focus ring. :focus-visible only matches keyboard/switch navigation, so pointer and
   touch users (i.e. the entire on-device experience) see exactly the same pixels as before. */
:where(button,[href],input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--tx);outline-offset:3px;border-radius:inherit}
input[type=range]:focus-visible{outline:2px solid var(--tx);outline-offset:6px;border-radius:10px}
.ctl:focus-visible{border-radius:14px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

/* ---------- 4D depth ---------- */
.tilt{position:relative;display:grid;place-items:center;
  transform:perspective(1400px)
    rotateX(calc(var(--my,0) * -8deg * var(--tiltk,1)))
    rotateY(calc(var(--mx,0) * 11deg * var(--tiltk,1)))}
.drift{animation:sway 17s ease-in-out infinite alternate}
.drift.off{animation:none}
.drift.paused{animation-play-state:paused}
@keyframes sway{0%{transform:rotateX(0.9deg) rotateY(-1.4deg)}100%{transform:rotateX(-1deg) rotateY(1.5deg)}}
button,.it,.chip,.pill,.seg button,.sw,.opt{touch-action:manipulation}
input[type=range]{touch-action:pan-y}
.filein{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}
/* off-screen status region: out of flow, so it never affects layout or paint */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;pointer-events:none;left:-9999px}
.tilt::after{content:"";position:absolute;inset:0;border-radius:44px;pointer-events:none;
  background:radial-gradient(58% 44% at var(--lx,50%) var(--ly,30%),rgba(255,255,255,.30),rgba(255,255,255,0) 72%);
  opacity:var(--glow,0);transition:opacity .35s}
.artwrap{transform:translate3d(calc(var(--mx,0) * 18px * var(--park,1)),calc(var(--my,0) * 18px * var(--park,1)),0)}
.meta{transform:translate3d(calc(var(--mx,0) * 9px * var(--park,1)),calc(var(--my,0) * 9px * var(--park,1)),0)}
.blobs{transform:translate3d(calc(var(--mx,0) * -30px * var(--park,1)),calc(var(--my,0) * -30px * var(--park,1)),0)}
@media (prefers-reduced-motion:reduce){
  .tilt,.drift{transform:none!important;animation:none!important}
  .artwrap,.top,.meta,.seek,.row,.lh,.list,.blobs{transform:none!important}
}

/* ---------- settings sheet ---------- */
.sheet{max-height:min(88vh,780px);overflow-y:auto;scrollbar-width:none;
  background:linear-gradient(rgba(8,6,22,.42),rgba(8,6,22,.42)),rgba(255,255,255,var(--glass))}
.sheet::-webkit-scrollbar{display:none}
.sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);opacity:.85;margin:6px 0 -6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 0;border-radius:18px;border:1px solid var(--edge);background:rgba(255,255,255,.12);
  color:var(--tx);font:600 13px inherit;font-family:inherit;cursor:pointer;
  transition:transform .4s var(--spring),background .3s}
.seg button:active{transform:scale(.94)}
.seg button.on{background:rgba(255,255,255,.34);box-shadow:inset 0 1px 0 var(--shine)}
.row2{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--tx2)}
.row2 em{font-style:normal;font-size:12px;opacity:.65;margin-left:6px}
.sw{width:52px;height:30px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.14);
  position:relative;cursor:pointer;transition:background .3s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.sw[aria-pressed="true"]{background:rgba(255,255,255,.42)}
.sw[aria-pressed="true"]::after{transform:translateX(22px)}
.pill.ghost{background:transparent;box-shadow:none;font-size:14px;color:var(--tx2);padding:10px}
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i></div>

<div class="tilt"><div class="drift"><main class="app glass" id="app">
  <div class="top">
    <button class="chip" id="closeBtn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <b>Now Playing</b>
    <button class="chip" id="optBtn" aria-label="Options" aria-controls="sheet" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div class="artwrap"><div class="art" id="art"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3v11.6A3.5 3.5 0 1 0 11 18V8h6V3z"/></svg></div></div>
  <div class="meta" aria-live="polite" aria-atomic="true"><h2 id="title">—</h2><p id="artist">—</p></div>
  <div class="seek"><input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Playback position" aria-valuetext="0:00"><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
  <div class="row">
    <button class="ctl" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="ctl main pp" id="pp" aria-label="Play or pause" aria-pressed="false"><svg class="pl" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg class="pa" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <button class="ctl" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
  </div>
<div class="lh">Playlist</div>
  <div class="list" id="list" role="list"></div>
</main></div></div>

<div class="bubble glass" id="bubble" role="button" tabindex="0" aria-label="Open player"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3v11.6A3.5 3.5 0 1 0 11 18V8h6V3z"/></svg></div>

<div class="scrim" id="scrim"></div>
<section class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <h3 id="sheetTitle">Settings</h3>

  <div class="sec">Glass</div>
  <label class="opt"><span>Transparency <em id="glV">18%</em></span><input type="range" id="gl" min="2" max="50" value="18" aria-valuetext="18%"></label>
  <label class="opt"><span>Blur <em id="blV">28</em></span><input type="range" id="bl" min="0" max="60" value="28" aria-valuetext="28 pixels"></label>
  <label class="opt"><span>Colour shift <em id="huV">250°</em></span><input type="range" id="hu" min="0" max="360" value="250" aria-valuetext="250 degrees"></label>

  <div class="sec">4D depth</div>
  <label class="opt"><span>Depth <em id="dpV">60%</em></span><input type="range" id="dp" min="0" max="100" value="60" aria-valuetext="60%"></label>
  <label class="opt"><span>Tilt <em id="tlV">100%</em></span><input type="range" id="tl" min="0" max="150" value="100" aria-valuetext="100%"></label>
  <label class="opt"><span>Parallax <em id="prV">100%</em></span><input type="range" id="pr" min="0" max="200" value="100" aria-valuetext="100%"></label>
  <label class="opt"><span>Light <em id="gvV">100%</em></span><input type="range" id="gv" min="0" max="200" value="100" aria-valuetext="100%"></label>
  <label class="opt"><span>Shadow <em id="sdV">100%</em></span><input type="range" id="sd" min="0" max="200" value="100" aria-valuetext="100%"></label>

  <div class="sec">Motion</div>
  <div class="seg" id="mot">
    <button data-m="auto" class="on" aria-pressed="true">Auto</button>
    <button data-m="touch" aria-pressed="false">Touch</button>
    <button data-m="off" aria-pressed="false">Off</button>
  </div>
  <div class="row2"><span>Idle drift <em>slow sway</em></span><button class="sw" id="driftBtn" aria-pressed="true" aria-label="Idle drift"></button></div>

  <div class="btns">
    <button class="pill" id="addBtn">Add songs</button>
    <button class="pill" id="doneBtn">Done</button>
  </div>
  <button class="pill ghost" id="resetBtn">Reset defaults</button>
  <input type="file" id="file" class="filein" accept="audio/*" multiple tabindex="-1">
</section>

<audio id="au" preload="auto" playsinline></audio>
<div class="sr" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
/* Glass Player - one page, no framework and no build step. Four layers, read top to bottom:

   state   `tracks` (the picked files), `idx`, the persisted settings object `S`, and a handful of
           flags that describe the moment - `switching`, `dragging`, `fails`, `blocked`, `stopped`.
           Everything else on the page is derived from these; nothing here is duplicated elsewhere.
   render  `load()` writes the now-playing block, `renderList()` moves the playlist highlight and
           only rebuilds rows when the set of files actually changed, and `resetSeek()` keeps the
           last values written by timeupdate in one place so a stale write cannot fight a newer one.
   audio   the single `<audio id="au">`. `load()` swaps its source, `attemptPlay()` classifies a
           refused play() rather than swallowing it, and the transport buttons, the skip chain and
           the mediaSession metadata all go through those two functions.
   depth   the 4D card. A spring on requestAnimationFrame (`tick`, parked by `kick` whenever it is
           at rest or the page is hidden) is fed by the gyroscope, mouse and touch handlers, and
           `paint()` writes the result out as CSS custom properties.
*/
const $=id=>document.getElementById(id);
/* Every node load() and resetSeek() touch, resolved once at startup instead of on
   each call. Nothing replaces these elements, so the references stay valid. */
const EL={
  title:$('title'),artist:$('artist'),art:$('art'),meta:document.querySelector('.meta'),
  hu:$('hu'),huV:$('huV'),seek:$('seek'),cur:$('cur'),dur:$('dur'),
  list:$('list')
};
const au=$('au'),app=$('app'),sheet=$('sheet'),scrim=$('scrim'),bubble=$('bubble');
/* The picker and the two skip buttons are never replaced either, but three paths looked one of
   them up again on every press: the empty-state row and a transport press with nothing loaded
   each did `getElementById('file')`, and the media-session next/previous handlers did
   `getElementById('next')`/`('prev')` to reach the button they click. That is a document lookup
   per tap for a node that has not moved since the page loaded. Resolved once here instead. */
const fileInput=$('file'),nextBtn=$('next'),prevBtn=$('prev');
/* The sheet's opener is the one control the sheet itself writes to: both of its transitions set
   `aria-expanded` on it. `openSheet()` and `closeSheet()` looked it up again on every transition -
   two document lookups for one open plus one close - although the node has not moved since the page
   loaded. Resolved once here instead, beside the picker and the two skip buttons. */
const optBtn=$('optBtn');
const tracks=[];
/* Every object URL this page creates is owned here, so the blobs can be released on teardown. */
const objUrls=new Set();
const mkUrl=b=>{const u=URL.createObjectURL(b);objUrls.add(u);return u};
let idx=0;
let switching=false;   // a new source is loading: ignore the pause event it fires
let pauseAsked=false;  // the pause on its way is the user's, not the one a source swap fires
let dragging=false;    // the user is scrubbing the seek bar
let fails=0;           // consecutive tracks that refused to play
const MAX_SKIP=3;      // how many consecutive unplayable tracks the skip chain may walk
let stopped=false;     // the skip chain gave up and reported; a trailing play() rejection must not talk over it
/* The last transport intent - play (true) or pause (false) - which is not the same thing as
   `playing` below: that is the state painted on the card, and a source swap clears it for a moment
   while the new track settles. The skip chain in `au.onerror` used to pass a hard `true` for
   autoplay, so an unplayable file resumed playback the listener had deliberately paused: pause,
   then Next onto a file the platform will not decode, and the player walked past it and started
   the following track out loud. Every load that asks for playback sets this, every deliberate
   pause clears it, and the chain now asks for exactly what the transport last asked for. */
let wantPlay=false;
/* One pending clear of `switching`, owned by whichever load armed it last. Every load used to
   start its own 700 ms timer and never cancel the previous one, so an earlier load's timer fired
   while a later source was still settling and dropped the guard under it - the queued pause of
   the newer swap then landed as if it were the user's, painting the card paused over a track
   that was starting. The handle lives here, and every path that clears the flag cancels the timer
   with it, so exactly one timer can be live and it always belongs to the most recent load. */
let switchTimer=0;
function clearSwitching(){clearTimeout(switchTimer);switchTimer=0;switching=false}
function armSwitching(){clearTimeout(switchTimer);switchTimer=setTimeout(clearSwitching,700)}
let swapToken=0;       // guards the delayed title swap against fast track skipping
let loadSrc=null;      // the source assigned for the track on deck, so a repeat load is a no-op
let loadAt=0;          // when that source was assigned (monotonic), for the rapid-repeat window
const REPEAT_MS=400;   // a second tap inside this window belongs to the same burst, not a new intent

/* A refused play() used to be swallowed by .catch(()=>{}), so a track the platform would not
   start looked exactly like a dead button. The rejection is now classified and surfaced
   without adding anything to the screen: a `data-blocked` state on the app element, a message
   in the off-screen status region for assistive tech, and - because a refused play leaves the
   previous track's "playing" class behind - the false playing state is dropped, so the button
   shows "play" (the thing that will actually work) instead of "pause". No styles, geometry,
   copy or animation change. */
let blocked=false;
const live=$('live');
let liveTimer=null;
function announce(msg){
  if(!live)return;
  if(liveTimer){clearTimeout(liveTimer);liveTimer=null}
  live.textContent='';
  if(!msg)return;
  liveTimer=setTimeout(()=>{liveTimer=null;live.textContent=msg},20);  /* a repeat still re-announces */
}
function setBlocked(v,msg){
  if(blocked!==v){blocked=v;app.dataset.blocked=v?'1':'0'}
  announce(msg||'');                          /* clearing the text on recovery leaves nothing stale */
}
/* The transport button showed whether it was playing by icon alone: the two SVGs are swapped by a
   CSS rule, which assistive tech cannot read, so the control announced the same "Play or pause"
   whether the player was running or stopped. aria-pressed carries that same state into the
   accessibility tree. Every place that painted the state now goes through here, so the attribute
   cannot drift from the class; the icons, the class name and everything on screen are unchanged. */
const ppBtn=$('pp');
let playing=false;
function setPlaying(v){
  if(playing===v)return;                      /* one write per real state change, not per event */
  playing=v;
  app.classList.toggle('playing',v);
  ppBtn.setAttribute('aria-pressed',v?'true':'false');
}
/* The Android shell holds audio focus only while this is true; a plain browser has no GP. Every
   path that starts or stops playback goes through here. It used to be written out at each call
   site, and the two stops that fire no pause event - a refused play, and the skip chain giving up
   on a run of unplayable tracks - only painted the page: the shell kept audio focus and its
   notification still said playing, so the next app that asked for focus was ducked for nothing.
   Nothing on screen is involved. */
function setShellPlaying(v){
  try{if(window.GP&&window.GP.setPlaying)window.GP.setPlaying(v)}catch(e){}
}
/* One source for the "cannot play" copy. It used to be typed out at four call sites, so the
   artist line and the status message could drift apart, and a fix to the wording meant finding
   every copy. n>0 is the skip chain giving up after n failures: same visible line, a status
   message that names the count. The copy itself is unchanged. */
const ERR_PLAY="Can't play this file";
const ERR_BLOCKED='Playback blocked. Tap play to start.';
function playError(n){
  EL.artist.textContent=ERR_PLAY;
  if(n)setBlocked(true,(n>1?'Stopped after '+n+' unplayable tracks. ':'')+ERR_PLAY+'.');
}
function playRefused(err){
  const denied=!!err&&(err.name==='NotAllowedError'||err.name==='SecurityError');
  clearSwitching();
  if(au.paused){
    setPlaying(false);
    setShellPlaying(false);
    if('mediaSession' in navigator){try{navigator.mediaSession.playbackState='paused'}catch(e){}}
  }
  /* the skip chain already said why it stopped; the rejection that follows the same bad source
     would replace that message with the generic one, so leave it alone */
  if(stopped&&!denied)return;
  setBlocked(true,denied?ERR_BLOCKED:ERR_PLAY);
}
function attemptPlay(onOk){
  stopped=false;               /* any fresh attempt gets a fresh budget of announcements */
  wantPlay=true;               /* an explicit request to play, for the skip chain to honour */
  pauseAsked=false;            /* a play request supersedes a pause that has not landed yet */
  let p;
  try{p=au.play()}catch(e){playRefused(e);return}
  if(!p||typeof p.then!=='function'){if(onOk)onOk();return}
  p.then(()=>{setBlocked(false,'');if(onOk)onOk()}).catch(playRefused);
}

const fmt=s=>{
  if(!isFinite(s)||s<0)return '0:00';
  s=Math.floor(s);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
};
/* Each slider's numeric readout is a separate <em> node, so the range input itself announced a
   bare number ("250") with no unit. aria-valuetext carries the same reading, unit included, and is
   written from the same places the visible readout is written so the two cannot disagree. The
   attribute is not rendered, so nothing on screen moves. */
const VT_UNIT={gl:'%',bl:' pixels',hu:' degrees',dp:'%',tl:'%',pr:'%',gv:'%',sd:'%'};
const vtOf=(id,v)=>v+(VT_UNIT[id]||'');
function setVT(el,txt){
  if(el&&el.getAttribute('aria-valuetext')!==txt)el.setAttribute('aria-valuetext',txt);
}
/* Re-trigger a CSS animation. The engine has to *see* the class removed before it is
   added back, and a style flush is enough for that: reading a layout property such as
   offsetWidth also forces a synchronous layout, which this path does not need. */
function restart(el,cls){el.classList.remove(cls);void getComputedStyle(el).animationName;el.classList.add(cls)}

/* lock screen / notification metadata */
function setSession(t){
  if(!('mediaSession' in navigator))return;
  try{
    if('MediaMetadata' in window){
      navigator.mediaSession.metadata=new MediaMetadata({title:t.t,artist:t.a,album:'Glass Player'});
    }
    navigator.mediaSession.playbackState=au.paused?'paused':'playing';
  }catch(e){}
}
/* The media session outlives the document that created it. Android keeps the notification and the
   lock-screen controls it was handed until something replaces them, so a page torn down without
   clearing them leaves the last track sitting on the lock screen - with a play button wired to a
   WebView that no longer exists, and a state that says "playing" over silence. Clear it on a real
   teardown only: a page going into the back/forward cache can come back with its audio intact, and
   a player collapsed to the bubble is still playing, so both keep their session. */
function clearSession(){
  if(!('mediaSession' in navigator))return;
  try{navigator.mediaSession.metadata=null}catch(e){}
  try{navigator.mediaSession.playbackState='none'}catch(e){}
  ['play','pause','nexttrack','previoustrack'].forEach(a=>{
    try{navigator.mediaSession.setActionHandler(a,null)}catch(e){}
  });
}

/* last values written by the timeupdate handler; reset whenever we write these nodes elsewhere */
const tuCache={p:null,v:null,cur:null,dur:null};
function resetSeek(){
  const sk=EL.seek;
  sk.value=0;sk.style.setProperty('--p','0%');
  EL.cur.textContent='0:00';
  setVT(sk,'0:00');
  EL.dur.textContent='--:--';
  tuCache.p=tuCache.v=tuCache.cur=tuCache.dur=null;
}

function load(i,autoplay,dir){
  wantPlay=!!autoplay;         /* what this load was asked for, so a failed one can be retried in kind */
  if(!tracks.length){
    EL.title.textContent='No songs yet';
    EL.artist.textContent='Add songs from your phone';
    resetSeek();renderList();return;
  }
  const n=(i+tracks.length)%tracks.length;
  /* Idempotent while a source is still settling. A second request for the track already on deck
     is a repeat tap, not a track change, and re-assigning `au.src` is destructive: the media
     reloads, the position drops to 0, the swap animation replays and the pause the reload fires
     leaves the transport showing "play" for a track that is starting. Only the settling window
     last REPEAT_MS is treated as a repeat, so a deliberate reload - next on a one-track list, a
     replay after `ended` - still swaps the source exactly as before. A timestamp rather than
     `switching` because that flag is cleared by a fixed 700 ms timer which a previous load can
     still be holding, and a stale timer must not decide whether this tap is a repeat. */
  if(n===idx&&tracks[n].src&&loadSrc===tracks[n].src&&performance.now()-loadAt<REPEAT_MS){
    if(autoplay&&au.paused)attemptPlay();
    return;
  }
  idx=n;
  const t=tracks[idx];
  const ui=()=>paintTrack(t);
  if(dir){
    [EL.art,EL.meta].forEach(el=>{el.style.setProperty('--d',dir);restart(el,'swap')});
    const token=++swapToken;
    setTimeout(()=>{if(token===swapToken)ui()},360);   /* skip if a newer track took over */
  }else ui();

  switching=true;
  resetSeek();
  setSession(t);
  try{
    au.src=t.src;
    loadSrc=t.src;loadAt=performance.now();
  }catch(e){
    clearSwitching();
    playError(0);
    return;
  }
  if(autoplay){
    attemptPlay(()=>{fails=0});
    /* the pause event from swapping the source is queued, not immediate. One handle, re-armed by
       each load, so an earlier load's window cannot close over a later one; a load that does not
       autoplay has nothing to guard against and leaves no timer behind. */
    armSwitching();
  }else{
    clearSwitching();
  }
}

/* transport */
/* Every deliberate pause goes through here, so `onpause` can tell the user's pause apart from the
   one swapping a source fires (see the guard there). */
function requestPause(){pauseAsked=true;wantPlay=false;au.pause()}
ppBtn.onclick=()=>{if(!tracks.length){fileInput.click();return}au.paused?attemptPlay():requestPause()};
nextBtn.onclick=()=>{if(!tracks.length){fileInput.click();return}load(idx+1,!au.paused||au.ended,1)};
prevBtn.onclick=()=>{
  if(!tracks.length){fileInput.click();return}
  au.currentTime>3?(au.currentTime=0):load(idx-1,!au.paused,-1);
};

au.onplay=()=>{
  setPlaying(true);
  restart(ppBtn,'bump');
  if('mediaSession' in navigator){try{navigator.mediaSession.playbackState='playing'}catch(e){}}
  setShellPlaying(true);
};
au.onpause=()=>{
  /* A source swap fires a pause of its own, and that one must not be painted as the user's: it
     would drop the `playing` class the new track is about to need. But the whole 700 ms switching
     window used to be treated as the swap's, so a pause tapped inside it - a second or so after
     Next, while the new track was already playing - was swallowed: the card kept the pause icon,
     the artwork stayed scaled up and the equaliser kept animating over silence, the Android shell
     was never told to drop audio focus, and nothing brought the transport back until the next
     play/pause. A pause the page asked for is now honoured whenever it lands; only an unsolicited
     one inside the window is ignored. */
  if(switching&&!pauseAsked)return;
  pauseAsked=false;
  wantPlay=false;              /* the listener stopped it (or the shell did): nothing should restart it */
  setShellPlaying(false);
  setPlaying(false);
  restart(ppBtn,'bump');
  if('mediaSession' in navigator){try{navigator.mediaSession.playbackState='paused'}catch(e){}}
};
au.onended=()=>load(idx+1,true,1);

au.onerror=()=>{
  clearSwitching();
  fails++;
  /* Bounded skip. This used to advance through the whole playlist on a run of unplayable
     files - one source swap per entry - so a long list of bad files meant dozens of loads
     and swap animations before anything settled, and with a large playlist it never settled
     at all. Three consecutive failures is enough to conclude the run is bad: stop there and
     say so. The visible copy is the message the path already showed; the specifics go to the
     off-screen status region, so nothing on screen moves. */
  if(tracks.length>1&&fails<MAX_SKIP){
    load(idx+1,wantPlay,1);    /* keep walking, but only towards playback the listener asked for */
  }else{
    const n=fails;
    fails=0;
    stopped=true;
    wantPlay=false;            /* the chain has stopped; a later error must not start anything */
    swapToken++;                 /* cancel a title swap still queued from the last attempt, or it lands after this message and replaces it */
    if(tracks[idx])paintTrack(tracks[idx]);   /* ...but paint the block now, so it names the track this gave up on */
    setPlaying(false);
    setShellPlaying(false);
    playError(n);
  }
};

/* fires ~4x/s: only touch the DOM when a value has actually changed */
au.ontimeupdate=()=>{
  const d=au.duration;
  if(!dragging){
    /* a stream can report a currentTime past its header duration (VBR MP3s and some WAVs do),
       which handed the bar a position outside [0, duration]; clamp it to the track's domain */
    const p=(isFinite(d)&&d>0)?Math.min(100,Math.max(0,au.currentTime/d*100)):0;
    const sk=EL.seek;
    const ps=p+'%';
    if(tuCache.p!==ps){tuCache.p=ps;sk.style.setProperty('--p',ps)}
    const pv=Math.round(p*10)/10;      /* step="0.1": the input snaps to this either way */
    if(tuCache.v!==pv){tuCache.v=pv;sk.value=pv}
    const cs=fmt(au.currentTime);
    if(tuCache.cur!==cs){tuCache.cur=cs;EL.cur.textContent=cs;setVT(sk,cs)}
  }
  if(isFinite(d)&&d>0){
    const ds=fmt(d);
    if(tuCache.dur!==ds){tuCache.dur=ds;EL.dur.textContent=ds}
  }
};
/* `au.duration` is `Infinity` for some streams and `NaN` until metadata arrives. Both used to be
   run through fmt() and printed as "0:00", which reads as a zero-length track. Every read site
   now treats a non-finite or non-positive duration as unknown and leaves the "--:--" marker
   resetSeek() writes, so the readout says "we don't know yet" instead of "nothing to play". */
const durOk=()=>{const d=au.duration;return isFinite(d)&&d>0};
function showDur(){
  if(!durOk()){tuCache.dur=null;EL.dur.textContent='--:--';return}
  const ds=fmt(au.duration);
  if(tuCache.dur!==ds){tuCache.dur=ds;EL.dur.textContent=ds}
}
au.onloadedmetadata=showDur;
au.ondurationchange=showDur;

/* seek bar: don't let timeupdate fight the user's thumb */
const sk=EL.seek;
/* The bar is a percentage and this handler is the only place that turns it into a media time, so
   both ends of that conversion are clamped to the media's own domain: the slider position into
   [0,100] and the resulting time into [0, duration]. A position outside the domain - a value left
   behind by a source swap, or a stream running past its header duration - used to reach
   `currentTime` and the `--p` fill unchecked, which drove the white fill past the end of the track
   and left the value the input believes it holds out of step with the value it actually holds.
   Every in-range position converts to exactly the time it converted to before, so nothing moves. */
const pctOf=v=>{const n=+v;return isFinite(n)?Math.min(100,Math.max(0,n)):0};
sk.oninput=e=>{
  const v=pctOf(e.target.value);
  if(+e.target.value!==v)e.target.value=v;
  e.target.style.setProperty('--p',v+'%');
  const d=au.duration;
  if(isFinite(d)&&d>0){
    const t=Math.min(d,Math.max(0,v/100*d));
    if(isFinite(t))au.currentTime=t;
  }
  EL.cur.textContent=fmt(au.currentTime);
  setVT(e.target,fmt(au.currentTime));
};
['pointerdown','touchstart'].forEach(ev=>sk.addEventListener(ev,()=>{dragging=true},{passive:true}));
['pointerup','pointercancel','touchend','touchcancel','blur'].forEach(ev=>sk.addEventListener(ev,()=>{dragging=false},{passive:true}));
['pointerup','pointercancel','touchend','touchcancel'].forEach(ev=>window.addEventListener(ev,()=>{dragging=false},{passive:true}));
document.addEventListener('visibilitychange',()=>{dragging=false;if(document.hidden)clearSwitching();});

/* The three blurred blobs behind the glass are the page backdrop. Their 14s float loop kept
   compositing while the player was collapsed to the bubble and while the page was hidden, where
   nothing of it is visible. Freeze it in both states; `animation-play-state` stops the loop in
   place, so the frame on screen is unchanged. `.drift`, the wrapper carrying the 17s sway around
   the whole card, is part of the same subtree and is frozen the same way - it was missed before,
   so the sway stayed live over a subtree whose only child is `display:none` once collapsed. */
const blobField=document.querySelector('.blobs');
let driftField=null,collapsed=false;
function syncBlobs(){
  const frozen=collapsed||document.hidden;
  if(blobField)blobField.classList.toggle('paused',frozen);
  driftField=driftField||document.querySelector('.drift');
  if(driftField)driftField.classList.toggle('paused',frozen);
}
function setCollapsed(v){collapsed=v;syncBlobs()}
document.addEventListener('visibilitychange',syncBlobs);

/* app open / close with bounce */
/* Collapsing the player used to leave focus on a node that was about to be hidden: press `#closeBtn`
   and 520ms later `document.activeElement` was still `#closeBtn`, inside the card `closeApp()` had
   just set to `display:none`; reopen with the bubble and focus was on the bubble, which `openApp()`
   had just hidden. Either way a keyboard or switch-access user was dropped to the document with no
   control under focus and had to tab in from the top to reach the player again.
   Now the node the close took focus from is remembered, the bubble takes focus at the moment the
   card is actually hidden (and only if the collapse left focus in the hidden card or nowhere, so a
   close never pulls focus off something the user has since moved to), and reopening hands focus
   back to that remembered node - or to `#closeBtn`, the bubble's counterpart, when there was none.
   `preventScroll` keeps either move from scrolling. Both moves are also gated on the last input
   being the keyboard (`kbInput`, tracked below): a script focus after a touch or mouse gesture is
   left to the browser's `:focus-visible` heuristic, and moving it there could paint the 2px focus
   ring on a control the user only tapped, which is a visible change. A pointer user therefore keeps
   exactly the pixels and the (harmless, ring-free) behaviour it had; a keyboard or switch user, the
   one who was actually stranded, gets a rendered control under focus at all times. */
let closeTimer=null,closing=false,cardFocus=null;
function openApp(){
  if(closeTimer){clearTimeout(closeTimer);closeTimer=null}   /* reopen mid-collapse: cancel the hide */
  closing=false;
  setCollapsed(false);
  bubble.classList.remove('show');
  app.style.display='';
  app.classList.remove('out');restart(app,'in');
  /* the card is rendered again: put focus back where the collapse took it from */
  const a=document.activeElement;
  if(kbInput&&(a===null||a===document.body||a===bubble)){
    let t=cardFocus;
    if(!t||t===app||!document.contains(t)||t.closest('.sheet'))t=$('closeBtn');
    try{t.focus({preventScroll:true})}catch(e){t.focus()}
  }
}
function closeApp(){
  if(closing)return;
  closing=true;
  /* remember where focus was, before the sheet close and the hide start moving it around; a node
     inside the sheet is no use on reopen (the sheet stays shut), so it falls back to `#closeBtn` */
  const a=document.activeElement;
  if(a&&a!==document.body&&a!==app&&app.contains(a))cardFocus=a.closest('.sheet')?null:a;
  closeSheet(false);
  app.classList.remove('in');app.classList.add('out');
  closeTimer=setTimeout(()=>{
    closeTimer=null;closing=false;
    app.style.display='none';bubble.classList.add('show');
    setCollapsed(true);                        /* nothing of the player is on screen now */
    const b=document.activeElement;            /* the only rendered control left is the bubble */
    if(kbInput&&(b===null||b===document.body||(b!==bubble&&app.contains(b)))){
      try{bubble.focus({preventScroll:true})}catch(e){bubble.focus()}
    }
  },520);
}
/* Which modality the last interaction used. `true` only after a keypress, cleared by any pointer or
   touch, so the two focus moves above happen for a keyboard or switch user and never for a tap.
   Capture phase, so the flag is already set when the handlers below run. */
let kbInput=false;
addEventListener('keydown',()=>{kbInput=true},true);
['pointerdown','touchstart','mousedown'].forEach(ev=>addEventListener(ev,()=>{kbInput=false},true));
$('closeBtn').onclick=closeApp;
bubble.onclick=openApp;
/* The bubble is the only way back into a collapsed player, so it must answer the keyboard the
   way a button does: Enter and Space activate it. A native button would also fire click on those
   keys; this div does not, so do it explicitly and swallow the default scroll on Space. */
bubble.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();openApp();}
});

/* options sheet with bounce */
let sheetTimer=null;
/* Closing the sheet used to strand focus. `Done`, a tap on the scrim and the Android back key all
   ran closeSheet while the focused control was inside the sheet, and when the 420ms close timer
   took `show` off, the section became display:none and the browser dropped focus to <body>. A
   keyboard or switch-access user was then back at the top of the document and had to tab through
   the whole player to reach the control they had been on. The control that opened the sheet is
   remembered and focused again on close, but only when focus is actually inside the sheet (or was
   lost to <body>), so a close never pulls focus away from somewhere the user has since moved to.
   `preventScroll` keeps the restore from scrolling the page, and `focus()` on a button only paints
   the :focus-visible ring when the last input was the keyboard, so a pointer or touch user sees
   the same pixels as before. */
let sheetFocus=optBtn;   /* the sheet's only opener: the fallback when nothing held focus */
/* The sheet is declared `aria-modal`, but the card behind the scrim stayed in the accessibility
   tree: a screen reader in browse mode could still read and activate `#pp`, `#next`, `#prev` and
   the playlist rows underneath a player the sheet is supposed to be covering. The card is now
   taken out of that tree for exactly as long as the sheet is open - with `inert`, which removes
   the subtree and refuses it focus, where the WebView has it, and with `aria-hidden` on the same
   node where it does not. Either one has to drop the opener's focus on the way in: Chrome will not
   apply a bare `aria-hidden` to a subtree that still contains the focused node, and an inert
   subtree cannot hold focus at all. That costs the opener nothing a keyboard user can feel - the
   Tab trap already sent its Tab to the sheet's first control, and it still does - and the close
   still restores that control, so the keyboard path is byte for byte the one it was. Neither
   attribute is read by a selector, so nothing is laid out, painted or animated differently, and a
   pointer or touch user's focus and ring state are what they were. */
const hasInert='inert' in HTMLElement.prototype;
function cardModal(on){
  if(hasInert)app.inert=on;
  else if(on)app.setAttribute('aria-hidden','true');
  else app.removeAttribute('aria-hidden');
  if(on){const a=document.activeElement;if(a&&a!==document.body&&app.contains(a))a.blur()}
}
function openSheet(){
  if(sheetTimer){clearTimeout(sheetTimer);sheetTimer=null}  /* reopen mid-close: cancel the hide */
  const a=document.activeElement;                            /* keep the previous opener if this one has none */
  if(a&&a!==document.body&&!sheet.contains(a))sheetFocus=a;
  sheet.classList.remove('out');sheet.classList.add('show');restart(sheet,'in');
  scrim.classList.add('on');
  optBtn.setAttribute('aria-expanded','true');
  cardModal(true);                                           /* the card is covered: out of the tree */
}
function closeSheet(restoreFocus=true){
  if(!sheet.classList.contains('show')||sheet.classList.contains('out'))return;
  if(sheetTimer){clearTimeout(sheetTimer);sheetTimer=null}
  cardModal(false);                                          /* readable again before focus goes back */
  const a=document.activeElement,had=a===null||a===document.body||sheet.contains(a);
  sheet.classList.remove('in');sheet.classList.add('out');scrim.classList.remove('on');
  optBtn.setAttribute('aria-expanded','false');
  sheetTimer=setTimeout(()=>{sheetTimer=null;sheet.classList.remove('show','out')},420);
  if(restoreFocus&&had&&sheetFocus&&document.contains(sheetFocus)){
    try{sheetFocus.focus({preventScroll:true})}catch(e){sheetFocus.focus()}
  }
}
optBtn.onclick=openSheet;$('doneBtn').onclick=()=>closeSheet();scrim.onclick=()=>closeSheet();
/* The sheet is a modal dialog, but Tab used to walk straight out of it: past `Reset defaults` the
   next Tab landed on the player's own controls behind the scrim, so a keyboard or switch user
   could operate the page the sheet was covering while the sheet stayed open, and the only way
   back was Shift+Tab through everything. Tab is now contained: inside the sheet it wraps from the
   last control to the first and back, and a Tab pressed while focus is still outside (the opener,
   or <body> after a tap-opened sheet) enters at the first control. Escape closes it down the same
   path Done, the scrim and the Android back key already take. The stop list is read on every
   keypress; `tabIndex` and `getClientRects` keep disabled, hidden and display:none controls (and
   the 1x1 file input parked off-screen) out of the ring, so nothing visible or interactive is
   added or moved. */
const sheetStops=()=>{
  const out=[];
  for(const el of sheet.querySelectorAll('button,[href],input,select,textarea,[tabindex]')){
    if(el.disabled||el.tabIndex<0||el.hidden||!el.getClientRects().length)continue;
    out.push(el);
  }
  return out;
};
document.addEventListener('keydown',e=>{
  if(!sheet.classList.contains('show')||sheet.classList.contains('out'))return;
  if(e.key==='Escape'||e.key==='Esc'){
    if(!e.altKey&&!e.ctrlKey&&!e.metaKey){e.preventDefault();closeSheet()}
    return;
  }
  if(e.key!=='Tab'||e.altKey||e.ctrlKey||e.metaKey)return;
  const f=sheetStops();
  if(!f.length)return;
  const first=f[0],last=f[f.length-1],a=document.activeElement;
  if(!sheet.contains(a)){e.preventDefault();(e.shiftKey?last:first).focus();return}
  if(e.shiftKey&&a===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&a===last){e.preventDefault();first.focus()}
});

/* ---------- settings: glass + 4D depth, persisted ---------- */
const root=document.documentElement.style;
const DEF={glass:18,blur:28,depth:60,tilt:100,par:100,glow:100,shadow:100,drift:1,motion:'auto'};
/* A restored setting is only trusted as far as the control that produces it can express it. The
   blob in storage is whatever the last version of this page wrote, and every key used to be copied
   into `S` verbatim: a `glass` of "abc" reached `--glass` as NaN, which makes
   `background:rgba(255,255,255,var(--glass))` invalid, so the card painted with no background and
   no backdrop blur at all; a null depth and a negative blur did the same to `--tiltk` and `--blur`,
   a parallax of 1e9 threw the layers across the screen, and the readouts printed "abc%" and
   "null%". Nothing on screen could put it back either - only the slider whose own value was bad
   repaired itself when dragged, so the rest of the damage survived the session. Each key is now
   accepted only in the shape its control produces: a finite number inside that slider's own
   min/max, 0 or 1 for the drift switch, one of the three motion modes. Anything else keeps the
   default, which is the only value guaranteed to be a working one. A value this page could have
   written is kept exactly as stored, so an ordinary session restores what it saved. */
const LIM={glass:[2,50],blur:[0,60],depth:[0,100],tilt:[0,150],par:[0,200],glow:[0,200],shadow:[0,200]};
const MODES=['auto','touch','off'];
let S=Object.assign({},DEF);
try{
  const raw=localStorage.getItem('glass.settings.v1');
  if(raw){
    const o=JSON.parse(raw);
    if(o&&typeof o==='object')Object.keys(DEF).forEach(k=>{
      const v=o[k];
      if(v===undefined||v===null)return;          /* absent: keep the default */
      if(k==='motion'){if(MODES.indexOf(v)>-1)S.motion=v;return}
      if(k==='drift'){if(v===0||v===1||v===true||v===false)S.drift=v?1:0;return}
      const lim=LIM[k];
      if(lim&&typeof v==='number'&&isFinite(v)&&v>=lim[0]&&v<=lim[1])S[k]=v;
    });
  }
}catch(e){}

/* A slider fires `input` continuously during a drag, and each one serialised the whole settings
   object and wrote it to localStorage synchronously on the main thread, mid-gesture. Slider
   writes are now coalesced into at most one every 200 ms; discrete toggles still write at once.
   A pending write is flushed when the page is hidden or torn down, so nothing is lost. */
let saveTimer=null;
function writeS(){saveTimer=null;try{localStorage.setItem('glass.settings.v1',JSON.stringify(S))}catch(e){}}
function saveS(){try{localStorage.setItem('glass.settings.v1',JSON.stringify(S))}catch(e){}}
function saveSSoon(){if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(writeS,200)}
function flushS(){if(saveTimer){clearTimeout(saveTimer);writeS()}}
window.addEventListener('pagehide',flushS);
/* An object URL keeps its blob alive until it is revoked or the document dies, so every file the
   picker handed over held its whole audio payload in memory whether it was playing or not: a
   session that added twenty songs carried all twenty. Release them when the document really is
   going away. `persisted` marks a page entering the back/forward cache, which can be restored with
   this state intact, so its sources must stay valid - that case is skipped. The element is
   detached before revoking: a URL the audio element still holds is not released, and a page that
   reaches here is not coming back to play it. */
function releaseUrls(){
  if(!objUrls.size)return;
  try{au.pause();au.removeAttribute('src');au.load()}catch(e){}
  objUrls.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}});
  objUrls.clear();
}
window.addEventListener('pagehide',e=>{if(!e.persisted){clearSession();releaseUrls()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushS()});

const REDUCED=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const motionOff=()=>REDUCED||S.motion==='off';

const driftEl=document.querySelector('.drift');
const driftBtn=$('driftBtn');
/* The motion segment's three buttons are never replaced, and the mode they show only changes when
   the user picks one. Resolved once here, with the mode last painted, so applyS() can skip the
   repaint when nothing it depends on has moved (see the note there). */
const segEl=$('mot'),segBtns=segEl?[...segEl.querySelectorAll('[data-m]')]:[];
let segMode=null;

/* last value written for each depth property; undefined means "not yet written" */
let pmx,pmy,plx,ply,pshx,pshy,pshb,pglow;
function paint(){
  const d=S.depth/100;
  const mx=tv.x*d,my=tv.y*d;
  const sk=S.shadow/100,gk=S.glow/100;
  const vmx=mx.toFixed(4),vmy=my.toFixed(4),
        vlx=(50+mx*44)+'%',vly=(50+my*44)+'%',
        vshx=(mx*-20*sk).toFixed(1)+'px',vshy=(my*-14*sk).toFixed(1)+'px',
        vshb=((Math.abs(mx)+Math.abs(my))*22*sk).toFixed(1)+'px',
        vglow=(Math.min(1,(Math.abs(mx)+Math.abs(my))*1.1)*gk).toFixed(3);
  if(vmx!==pmx){pmx=vmx;root.setProperty('--mx',vmx)}
  if(vmy!==pmy){pmy=vmy;root.setProperty('--my',vmy)}
  if(vlx!==plx){plx=vlx;root.setProperty('--lx',vlx)}
  if(vly!==ply){ply=vly;root.setProperty('--ly',vly)}
  if(vshx!==pshx){pshx=vshx;root.setProperty('--shx',vshx)}
  if(vshy!==pshy){pshy=vshy;root.setProperty('--shy',vshy)}
  if(vshb!==pshb){pshb=vshb;root.setProperty('--shb',vshb)}
  if(vglow!==pglow){pglow=vglow;root.setProperty('--glow',vglow)}
}

/* The four global depth properties, and the value last written for each; undefined means "not yet
   written". `applyS()` is the settings applier and every slider's `input` handler calls it, so a
   drag runs it once per frame - and three of these four belong to a slider the drag is not
   touching. Each was written unconditionally, so dragging Shadow rewrote `--blur` and `--glass`,
   the two properties `backdrop-filter` on the card and the sheet resolve against, to the value they
   already held. Compared and skipped the same way `paint()` above already guards its own eight.
   Nothing else in the page writes these four, so the cache cannot go stale. */
let pglass,pblur,ptiltk,ppark;
function applyS(){
  const vg=''+(S.glass/100),vb=S.blur+'px',
        vt=(S.tilt/100).toFixed(3),vp=(S.par/100).toFixed(3);
  if(vg!==pglass){pglass=vg;root.setProperty('--glass',vg)}
  if(vb!==pblur){pblur=vb;root.setProperty('--blur',vb)}
  if(vt!==ptiltk){ptiltk=vt;root.setProperty('--tiltk',vt)}
  if(vp!==ppark){ppark=vp;root.setProperty('--park',vp)}
  if(driftEl)driftEl.classList.toggle('off',!S.drift);
  if(driftBtn)driftBtn.setAttribute('aria-pressed',S.drift?'true':'false');
  /* The three motion buttons only carried a visual `on` class, so a screen reader announced all
     three as plain buttons with no indication of which mode was active. The selected one is now
     also published as aria-pressed, which is pure semantics: no selector in this page matches
     [aria-pressed] on .seg button, so nothing about the paint changes.
     This runs on every `input` of a slider drag, and a slider cannot change the motion mode - but
     each frame re-resolved #mot, re-queried its three buttons and rewrote all six of their
     class/attribute values for nothing. The mode last painted is remembered instead, so a drag
     that leaves the mode alone leaves the segment alone; picking a mode still repaints it once. */
  if(S.motion!==segMode){
    segMode=S.motion;
    segBtns.forEach(b=>{
      const on=b.dataset.m===S.motion;
      b.classList.toggle('on',on);
      b.setAttribute('aria-pressed',on?'true':'false');
    });
  }
  if(motionOff()){tg.x=0;tg.y=0;kick()}
  paint();
}

const SLIDERS=[['gl','glass','%'],['bl','blur',''],['dp','depth','%'],['tl','tilt','%'],
               ['pr','par','%'],['gv','glow','%'],['sd','shadow','%']];
/* Each slider's input and its numeric readout are fixed for the life of the page, but the readout
   was looked up again on every `input` event - a drag fires those continuously - and syncSlider()
   looked both of them up on every call. They are resolved once here instead, so a drag frame costs
   no document lookup for the two nodes it writes. */
const SL={};
SLIDERS.forEach(([id,key,suf])=>{const el=$(id);if(el)SL[id]={el,out:$(id+'V'),key,suf}});
function syncSlider(id){
  const s=SL[id];if(!s)return;
  const el=s.el;
  el.value=S[s.key];
  el.style.setProperty('--p',((S[s.key]-el.min)/(el.max-el.min)*100)+'%');
  if(s.out)s.out.textContent=S[s.key]+s.suf;
  setVT(el,vtOf(id,S[s.key]));
}
Object.keys(SL).forEach(id=>{
  const s=SL[id],el=s.el,key=s.key;
  syncSlider(id);
  el.oninput=()=>{
    S[key]=+el.value;
    el.style.setProperty('--p',((el.value-el.min)/(el.max-el.min)*100)+'%');
    if(s.out)s.out.textContent=el.value+s.suf;
    setVT(el,vtOf(id,el.value));
    applyS();saveSSoon();
  };
});

/* colour shift stays tied to the current track */
const huEl=$('hu');
if(huEl){
  huEl.oninput=()=>{
    huEl.style.setProperty('--p',(huEl.value/360*100)+'%');
    root.setProperty('--h',huEl.value);
    EL.huV.textContent=huEl.value+'°';
    setVT(huEl,vtOf('hu',huEl.value));
  };
}

if(segEl)segEl.onclick=e=>{
  const b=e.target.closest('[data-m]');if(!b)return;
  S.motion=b.dataset.m;applyS();saveS();
};
if(driftBtn)driftBtn.onclick=()=>{S.drift=S.drift?0:1;applyS();saveS()};
if($('resetBtn'))$('resetBtn').onclick=()=>{
  S=Object.assign({},DEF);
  Object.keys(SL).forEach(syncSlider);
  applyS();saveS();
};

/* ---------- 4D depth engine ---------- */
const tv={x:0,y:0};            // smoothed tilt
const tg={x:0,y:0};            // target tilt, -1..1
let rafId=null,hasGyro=false;
/* The spring is driven by requestAnimationFrame, and the loop used to keep asking for frames
   while the page was hidden, where nothing it paints can be seen. Worse, it was left holding an
   id for a frame the WebView never delivers: the Android shell pauses the WebView with the
   activity, so the queued callback does not run, and `kick()` reads a non-null `rafId` as "a
   frame is already queued" and declines to schedule another. One trip to the background
   therefore left the depth engine dead for the rest of the session - the card no longer
   responded to the gyroscope or to a finger until the page was reloaded. The loop now stops on
   hide and restarts on show; `tv` is left exactly where the last delivered frame put it, so the
   spring continues from the same point it would have continued from otherwise and the motion on
   screen is unchanged. */
let hiddenNow=!!document.hidden;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const springBusy=()=>Math.abs(tg.x-tv.x)>0.0015||Math.abs(tg.y-tv.y)>0.0015;

function tick(){
  if(hiddenNow){rafId=null;return}
  tv.x+=(tg.x-tv.x)*0.14;
  tv.y+=(tg.y-tv.y)*0.14;
  paint();
  rafId=springBusy()?requestAnimationFrame(tick):null;
}
function kick(){if(!rafId&&!hiddenNow)rafId=requestAnimationFrame(tick)}
/* Hidden: drop the queued frame so the id cannot outlive it. Visible: pick the spring back up if
   a target moved while the loop was stopped - a settings change, a rotation settle or a sensor
   reading that arrived in the background - and leave it alone when it had already come to rest. */
document.addEventListener('visibilitychange',()=>{
  hiddenNow=!!document.hidden;
  if(hiddenNow){
    if(rafId!==null){cancelAnimationFrame(rafId);rafId=null}
  }else if(springBusy()){
    kick();
  }
});

/* gyroscope: the source that makes the card feel physical.
   A sensor event is not guaranteed to carry two usable angles. The first event on many devices
   reports only `alpha` - beta and gamma are null - and a sensor that has lost calibration can
   report a value that is not a number at all. The old guard only tested `== null`, so the first
   shape was already a harmless no-op but the second walked straight through: NaN reached the
   spring, tg and tv became NaN, paint() wrote "NaN" into --mx/--my/--lx/--glow, and the depth
   and glow were dead for the rest of the session - even a later good reading could not recover
   them, because NaN survives the smoothing. Requiring both angles to be finite makes every
   partial or broken event a no-op, so the next real one still lands. */
window.addEventListener('deviceorientation',e=>{
  if(motionOff()||S.motion==='touch')return;
  const b=e.beta,g=e.gamma;
  if(!Number.isFinite(b)||!Number.isFinite(g))return;
  hasGyro=true;
  tg.y=clamp((b-52)/34,-1,1);
  tg.x=clamp(g/34,-1,1);
  kick();
},{passive:true});

/* mouse, for desktop */
window.addEventListener('pointermove',e=>{
  if(motionOff()||e.pointerType==='touch')return;
  if(S.motion==='auto'&&hasGyro)return;
  tg.x=clamp((e.clientX/window.innerWidth-0.5)*2,-1,1);
  tg.y=clamp((e.clientY/window.innerHeight-0.5)*2,-1,1);
  kick();
},{passive:true});

/* touch: press the artwork and push the card around.
   The box is measured once per gesture at touchstart and the rect reused for every move:
   reading it inside touchmove forced a synchronous layout on each frame of the drag.
   The cache is dropped whenever the card can have moved under the finger. */
const artBox=$('art');
let tiltRect=null;
function measureTilt(){
  const r=artBox.getBoundingClientRect();
  tiltRect=(r.width&&r.height)?r:null;
  return tiltRect;
}
function touchTilt(e,r){
  const t=e.touches&&e.touches[0];if(!t)return;
  r=r||measureTilt();                     /* no cached box (move without start): measure once */
  if(!r||!r.width||!r.height)return;
  tg.x=clamp((t.clientX-(r.left+r.width/2))/(r.width/2),-1,1);
  tg.y=clamp((t.clientY-(r.top+r.height/2))/(r.height/2),-1,1);
  kick();
}
if(artBox){
  const canTilt=()=>!motionOff()&&!(S.motion==='auto'&&hasGyro);
  const tStart=e=>{if(!canTilt())return;touchTilt(e,measureTilt())};
  const tMove=e=>{if(!canTilt())return;touchTilt(e,tiltRect)};
  /* Drop the cached box and let the card spring back flat - the same settle a lifted finger
     produces, unless the gyroscope is the thing aiming it. */
  const relax=()=>{
    tiltRect=null;
    if(!(S.motion==='auto'&&hasGyro)){tg.x=0;tg.y=0;kick()}
  };
  const tDrop=()=>{tiltRect=null};
  artBox.addEventListener('touchstart',tStart,{passive:true});
  artBox.addEventListener('touchmove',tMove,{passive:true});
  artBox.addEventListener('touchend',relax,{passive:true});
  artBox.addEventListener('touchcancel',relax,{passive:true});
  /* A rotation or resize moves the card's box out from under the finger. The cache was already
     dropped so the next move re-measures, but the *target* tilt was left where the last move put
     it, so the card held the pre-rotation angle with no finger on it whenever the gesture's end
     never arrived - a resize that cancels an active touch does not always deliver touchend or
     touchcancel. Reset the target as well, so a rotation always settles the card flat.
     Scrolling only drops the cache: the finger is still down and the next move re-aims it. */
  window.addEventListener('scroll',tDrop,{passive:true,capture:true});
  window.addEventListener('resize',relax,{passive:true});
  window.addEventListener('orientationchange',relax,{passive:true});
}

applyS();

/* own songs */
$('addBtn').onclick=()=>fileInput.click();
$('file').onchange=e=>{
  /* A cancelled picker does not always deliver an empty FileList: the Android WebView reports a
     back-out as `files === null`, and spreading that threw an uncaught TypeError every time the
     user dismissed the picker. Read it defensively - nothing picked means nothing to do, and the
     playlist, the current track and the seek bar are left exactly as they were. */
  const fs=e.target.files?[...e.target.files]:[];
  e.target.value='';                       /* so picking the same file again still fires */
  if(!fs.length)return;
  /* Identity for the duplicate check used to be the display name plus the artist line, and the
     artist line is the constant "My library" - so the key was the bare name, and two different
     songs that happen to share a file name ("01 Intro.mp3" from two albums, or the same track
     name in two folders) collapsed into a single entry: the second was dropped without a word
     and could never be played. The key is now the name together with the file's own size and
     modification time, which a repeat pick of the same file reproduces exactly and a different
     file with the same name does not. The display name and every other field are unchanged. */
  const seen=new Set(tracks.map(t=>t.k));
  const first=tracks.length;
  fs.forEach(f=>{
    const name=f.name.replace(/\.[^.]+$/,'');
    const key=name+'|'+f.size+'|'+f.lastModified;
    if(seen.has(key))return;               /* don't stack duplicates */
    seen.add(key);
    tracks.push({
      t:name,
      a:'My library',
      k:key,
      /* golden angle: hues stay spread out. The product is taken mod 360 to keep the angle in
         [0,360), but rounding can land on exactly 360 on long lists (n = 610, 1220, 1830 ...),
         which is hue 0 written as a value outside the 0-359 domain every other read site assumes
         - the colour slider then reads back clamped to its max while the label reads "360 degrees".
         Wrapping the rounded value keeps the stored hue in 0-359 and leaves the colour identical,
         since hue 360 and hue 0 are the same angle. */
      h:Math.round((tracks.length*137.508)%360)%360,
      src:mkUrl(f)
    });
  });
  closeSheet();
  if(tracks.length===first){
    if(!tracks.length){EL.title.textContent='No songs yet';EL.artist.textContent='Add songs from your phone';renderList();resetSeek();}
    return;                                /* everything picked was already in the list */
  }
  load(first,true,1);
};

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Adding a song used to throw the keyboard user out of the playlist. The rebuild below replaces
   every row node, so a row that held focus was destroyed under the focus and the browser dropped
   it to <body>: a keyboard or switch user landed back at the top of the document and had to tab
   in again to reach the song they had been on. The row that last held focus is remembered (by its
   own `data-i`, not by node identity, since the node is about to be replaced) and the rebuilt row
   with the same key is focused again, with `preventScroll` so the list does not jump. Focus is
   only taken back when it was inside the list or had already fallen to <body> - a user who has
   since moved to another control keeps it - and `focus()` only paints the :focus-visible ring when
   the last input was the keyboard, so a pointer or touch user sees the same pixels as before. */
let listFocusKey=null;
document.addEventListener('focusin',e=>{
  const t=e.target;
  if(!t||!t.closest)return;
  const r=t.closest('#list .it');
  if(r)listFocusKey=r.dataset.add?'add':r.dataset.i;
  else if(t!==document.body&&t.id!=='file')listFocusKey=null;   /* focus moved to a real control */
});
const rowKey=r=>r.dataset.add?'add':r.dataset.i;
function focusRow(list,key){
  const rows=list.children;
  for(let i=0;i<rows.length;i++){
    if(rowKey(rows[i])===key){
      try{rows[i].focus({preventScroll:true})}catch(e){rows[i].focus()}
      return true;
    }
  }
  return false;
}
let listCount=-1;
/* Everything the now-playing block shows for one track: the title and artist, the artwork hue, the
   colour-shift slider that is tied to that hue, and the playlist highlight. `load()` used to own
   this as a closure and run it either immediately or, for a track change, 360 ms later inside the
   swap animation. The skip chain's give-up branch cancelled that queued run to stop a stale title
   landing over its error message - but the queue also carried this whole paint, so a run of
   unplayable files left the header and the playlist showing whatever the last successful paint
   had put there. With one unplayable file picked into an empty player that was the startup state:
   the title read "No songs yet" and the playlist still showed the "Tap here to add songs" row,
   over a track that was in `tracks`. The paint is now a function both paths can call, and the
   give-up branch calls it for the track it gave up on, so the block names the file that failed
   before the error line replaces the artist. */
function paintTrack(t){
  EL.title.textContent=t.t;EL.artist.textContent=t.a;
  EL.art.style.setProperty('--ah',t.h);
  document.documentElement.style.setProperty('--h',t.h);
  EL.hu.value=t.h;EL.huV.textContent=t.h+'°';setVT(EL.hu,vtOf('hu',t.h));
  EL.hu.style.setProperty('--p',(t.h/360*100)+'%');
  renderList();
}
function renderList(rebuild){
  const list=EL.list;
  if(!tracks.length){
    if(rebuild||listCount!==0){
      const a=document.activeElement,key=a&&a!==document.body&&list.contains(a)?rowKey(a):null;
      list.innerHTML='<div class="it" role="listitem" tabindex="0" data-add="1"><div class="tt"><b>No songs yet</b><small>Tap here to add songs</small></div></div>';
      listCount=0;
      if(key)focusRow(list,key);
    }
    return;
  }
  /* rebuild only when the set of songs changed; a track change just moves the highlight */
  if(rebuild||listCount!==tracks.length||list.children.length!==tracks.length){
    const a=document.activeElement;
    const key=a&&a!==document.body&&list.contains(a)?rowKey(a)
      :(a===null||a===document.body)?listFocusKey:null;
    list.innerHTML=tracks.map((t,i)=>`<div class="it${i===idx?' cur':''}" role="listitem" tabindex="0" data-i="${i}"${i===idx?' aria-current="true"':''}><div class="th" style="--ah:${t.h}"></div><div class="tt"><b>${esc(t.t)}</b><small>${esc(t.a)}</small></div><div class="eq"><i></i><i></i><i></i></div></div>`).join('');
    listCount=tracks.length;
    if(key&&!focusRow(list,key)&&list.children.length){
      /* the exact row is gone (the empty-state row after the first song arrives); land on the
         row that now sits at that position rather than leaving focus on <body> */
      const i=key==='add'?0:Math.min(+key||0,list.children.length-1);
      focusRow(list,rowKey(list.children[i]));
    }
    return;
  }
  const rows=list.children;
  for(let i=0;i<rows.length;i++){
    const want=(i===idx);
    if(rows[i].classList.contains('cur')!==want)rows[i].classList.toggle('cur',want);
    /* The row that is playing was marked by the `cur` class alone, which is paint, not meaning:
       every row in the list announced itself identically, so a screen-reader user had no way to
       tell which song the transport buttons were pointing at. `aria-current` carries that one bit
       of state on the same row the class already moves, written from the same two places the
       class is written, so the two cannot disagree. No stylesheet selects on the attribute, so
       nothing visible changes. */
    const isCur=rows[i].getAttribute('aria-current')==='true';
    if(isCur!==want){
      if(want)rows[i].setAttribute('aria-current','true');
      else rows[i].removeAttribute('aria-current');
    }
  }
}
/* A playlist row is the only way to jump to a song, and it answered the pointer alone. The rows
   were plain divs, so the tab order stepped over the whole playlist: a keyboard or switch-access
   user could walk the transport buttons but could not select an entry at all, and the empty-state
   row could not open the picker either - the same gap item 35 fixed on the bubble, still open on
   every row. Each row is now a tab stop, and Enter or Space activates it through `activateRow`,
   the one function the click handler also calls, so the two paths cannot drift apart. `tabindex`
   adds no box and the focus ring is drawn only for `:focus-visible` (keyboard navigation), so a
   pointer or touch user sees exactly the pixels they saw before. */
function activateRow(r){
  if(!r)return;
  if(r.dataset.add){fileInput.click();return}
  const i=+r.dataset.i;
  if(i===idx){
    /* this row's source was assigned a moment ago: a repeat tap in the same burst, not a request
       to pause. Toggling here stopped the track the first tap had just started. */
    if(performance.now()-loadAt<REPEAT_MS)return;
    au.paused?attemptPlay():requestPause();return;
  }
  load(i,true,i>idx?1:-1);
}
EL.list.onclick=e=>{activateRow(e.target.closest('.it'))};
/* Space is swallowed so it activates the row instead of scrolling the player, which is what a
   native button would do. Enter needs no default to suppress. */
EL.list.onkeydown=e=>{
  if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Spacebar')return;
  const r=e.target.closest&&e.target.closest('.it');
  if(!r)return;
  e.preventDefault();
  activateRow(r);
};

/* Android hardware back: sheet, then player, then let the app close */
window.__onBack=function(){
  try{
    if(sheet.classList.contains('show')&&!sheet.classList.contains('out')){closeSheet();return true}
    if(app.style.display!=='none'&&!closing){closeApp();return true}
  }catch(e){}
  return false;
};

load(0,false);
restart(app,'in');
if('mediaSession' in navigator){
  const bind=(a,fn)=>{try{navigator.mediaSession.setActionHandler(a,fn)}catch(e){}};
  bind('nexttrack',()=>nextBtn.click());
  bind('previoustrack',()=>prevBtn.click());
  bind('play',()=>attemptPlay());
  bind('pause',()=>requestPause());
}
</script>
